      summary: Update a Team Member
      operationId: UpdateATeamMember
      description: 'Update a TeamMember using this action. It requires a JSON object containing a TeamMember.


        **Important**


        - Organization Admin cannot be created or updated through the API.

        - To assign a Department Admin or Developer your account must be on the Connect/Growth Plan.


        **The `department_permissions` array replaces the TeamMember''s entire permission set.** A Department present in the array is created or updated; a Department omitted from the array has its permission removed, if your API key is authorized to remove it.


        Which TeamMembers you can update depends on the type of API key you use:


        | Access Level | Account-wide key | Department-specific key |

        | --- | --- | --- |

        | Team Member | Any Department in the account | Its own Department only |

        | Department Admin | Any Department in the account | Not permitted |

        | Developer | Any Department in the account | Not permitted |

        | Organization Admin | Not permitted | Not permitted |


        **Permitted values by `access_level`.**


        FieldTeam MemberDepartment Admin*Developer*


        access_levelteam_memberdepartment_admindeveloper


        roleeditor

        credential_issuer

        viewereditorviewer


        apiNAfalsetruetrue


        designstrue

        falsetrue

        falsetrueNA


        emailstrue

        falsetrue

        falsetrueNA


        credential_attributestrue

        falsetrue

        falsetrueNA


        analyticstrue

        falsetrue

        falsetrueNA


        settingstrue

        falsetrue

        falsetrueNA


        pathwaystrue

        falsetrue

        falsetrueNA


        teamNAtrue

        falsetrueNA


        analytics_emailNAtrue

        falsetrueNA


        manage_dept_admins_and_devsNAtrue

        falsetrueNA


        groupsArray of Group IDs to limit access toNA (All groups allowed)NA (All groups allowed)


        *NA - Not Applicable, can be omitted.*

        * *Only available on Connect/Growth Plan.*'
