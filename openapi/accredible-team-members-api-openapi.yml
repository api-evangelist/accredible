      responses:
        '200':
          description: OK
          headers: {}
          content:
            application/json:
              schema:
                type: object
                properties:
                  team_member:
                    type: object
                    properties:
                      id:
                        type: number
                      name:
                        type: string
                      email:
                        type: string
                      department_permissions:
                        type: array
                        items:
                          type: object
                          properties:
                            department:
                              type: number
                            permissions:
                              type: object
                              properties:
                                designs:
                                  type: boolean
                                emails:
                                  type: boolean
                                credential_attributes:
                                  type: boolean
                                analytics:
