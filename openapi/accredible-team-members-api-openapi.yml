        source: "curl -X PUT \\\n  \"https://api.accredible.com/v1/team_members/12345\" \\\n  -H \"Authorization: Token token=YOUR_API_KEY\" \\\n  -H \"Content-Type: application/json\" \\\n  -d '{\n  \"team_member\": {\n    \"department_permissions\": [\n      {\n        \"department_id\": 34,\n        \"permissions\": {\n          \"designs\": false,\n          \"emails\": false,\n          \"credential_attributes\": true,\n          \"analytics\": true,\n          \"settings\": true,\n          \"role\": \"editor\",\n          \"pathways\": true,\n          \"groups\": [\n            1,\n            2,\n            3\n          ],\n          \"api\": false,\n          \"team\": true,\n          \"access_level\": \"department_admin\",\n          \"analytics_email\": true,\n          \"manage_dept_admins_and_devs\": true\n        }\n      },\n      {\n        \"department_id\": 35,\n        \"permissions\": {\n          \"designs\": false,\n          \"emails\": false,\n          \"credential_attributes\": false,\n          \"analytics\": false,\n          \"settings\": false,\n          \"role\": \"viewer\",\n          \"pathways\": false,\n          \"groups\": null,\n          \"api\": false,\n          \"team\": false,\n          \"access_level\": \"team_member\",\n          \"analytics_email\": false,\n          \"manage_dept_admins_and_devs\": false\n        }\n      }\n    ]\n  }\n}'"
