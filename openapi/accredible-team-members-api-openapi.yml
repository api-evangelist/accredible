      summary: Delete a Team Member
      operationId: DeleteATeamMember
      description: 'Remove a TeamMember from the Departments your API key can reach.


        What the request removes depends on the type of API key you use:


        | Access Level | Account-wide key | Department-specific key |

        | --- | --- | --- |

        | Team Member | Any Department in the account | Its own Department only |

        | Department Admin | Any Department in the account | Not removed |

        | Developer | Any Department in the account | Not removed |

        | Organization Admin | Not removed | Not removed |'
      tags:
      - Team Members
      parameters:
      - name: id
        in: path
        description: ID of the TeamMember in the form of an integer.
        required: true
        schema:
          type: string
