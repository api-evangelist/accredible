        label: cURL
        source: "curl -X POST \\\n  \"https://api.accredible.com/v2/credentials/bulk_create\" \\\n  -H \"Authorization: Token token=YOUR_API_KEY\" \\\n  -H \"Content-Type: application/json\" \\\n  -d '{\n  \"credentials\": [\n    {\n      \"recipient\": {\n        \"name\": \"John Doe\",\n        \"email\": \"student@example.com\",\n        \"phone_number\": \"+14155552671\"\n      },\n      \"group_id\": 22625\n    },\n    {\n      \"recipient\": {\n        \"name\": \"Jane Smith\",\n        \"email\": \"jane@example.com\",\n        \"phone_number\": \"+14155552672\"\n      },\n      \"group_id\": 62430\n    }\n  ]\n}'"
      x-operation-id-source: normalized
      x-operation-id-original: Bulk Create Credentials (v2)
