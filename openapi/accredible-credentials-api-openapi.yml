      summary: Create a New Credential
      operationId: CreateANewCredential
      description: 'You create a Credential with optional EvidenceItems and References using this action. Please make sure that you''ve created a group on your dashboard before creating a Credential. If you haven''t then create a group in the dashboard or use this API request.


        This endpoint requires a JSON object containing a Credential.


        **Important:** If you don''t have enough credits when attempting to create Credentials with this endpoint, your credentials will still be created in your account, but will not be published. This will save your data and prevent you from having to re-attempt your request later. You will be able to publish the created credentials in your account when you have the required credits


        Creating Credentials - Video Walkthrough'
      tags:
      - Credentials
      requestBody:
        content:
          application/json:
            example:
              credential:
                recipient:
                  name: John Doe
                  email: person@example.com
                  phone_number: '+14155552671'
                  id: PK-17993
                  meta_data:
                    credential_batch: '772'
                name: Credential Name
                group_name: course1234
                group_id: 23
                description: null
                issued_on: '2014-06-14'
                evidence_items:
                - description: Report card including all grades
                  url: http://www.awesomelearningexample.com/johndoe/reportcard
                  category: url
                - description: Final essay
                  file: https://s3.amazonaws.com/accredible_api_evidence_items/files/12/original/open-uri20140316-15266-1m3by6h.jpeg
                  category: file
                references:
                - description: John worked hard on this course and provided exemplary understanding of the core concepts
                  referee:
                    name: Jane Doe
                    email: person2@example.com
                    avatar: https://placehold.it/100x100
                    url: https://any-url.com
                  relationship: managed
                custom_attributes:
                  custom_variables: some value
                  dob: 29 jan 1970
                meta_data:
                  batch_id: TK210
            schema:
              type: object
              properties:
                id:
                  type: string
                  description: The unique ID of the credential. If you supply your own internal ID we'll use this as a reference for the Credential. If not we'll assign an ID.
                recipient.name:
                  type: string
                  description: The name of the recipient the credential is issued to.
                recipient.email:
                  type: string
                  description: The recipient's email address.
                recipient.phone_number:
                  type: string
                  description: The recipient's phone number in E.164 format (e.g., +14155552671). This field is optional and available as part of the Growth plan. Phone numbers are used for SMS campaigns and are associated with the credential.
                recipient.id:
                  type: string
                  description: The recipient's user ID as defined by your organization. This alllows you to easily map your recipients to their Credentials regardless of changes to their email address.
                recipient.meta_data:
                  type: object
                  properties: {}
                  description: You can use this parameter to attach key-value strings to the object. Meta data is useful for storing additional, structured information on an object.
                group_id:
                  type: number
                  description: Group Id to which the credential should belong.
                name:
                  type: string
                  description: The Credential/course name displayed to recipients. This is required if the Group the Credential belongs to doesn't have a Course Name set.
                description:
                  type: string
                  description: The credential/course description displayed to recipients. This is required if the Group the Credential belongs to doesn't have a Course Description set.
                custom_attributes:
                  type: object
                  properties: {}
                  description: Custom variables to display on the Credential. These should be added to the design using the visual editor. Data should be formatted as a JSON hash where keys are the custom attribute names and the values are the values to be displayed on the Credential.
                issued_on:
                  type: string
                  description: 'Date of issue, the default is when the credential is created. Format: YYYY-MM-DD (DD/MM/YYYY also works but is deprecated)'
                expired_on:
                  type: string
                  description: 'Date you would like the credential to expire on, null by default. Format: YYYY-MM-DD (DD/MM/YYYY also works but is deprecated)'
                complete:
                  type: boolean
                  description: Whether the achievement is complete or still in progress, true by default.
                private:
                  type: boolean
                  description: Whether to make credential private. When it is set to `true`, the Credential will be private and visible only to its recipient who has signed into credential.net. If no value is set, the default value will be automatically assigned based on `Group.generate_private_credential` and `Department.generate_private_credential`. `Department.generate_private_credential` will be used as the default when `Group.generate_private_credential` is set to `null`. `Group.generate_private_credential` will override `Department.generate_private_credential` and be used as the default when it is set to `true` or `false`.
                approve:
                  type: boolean
                  description: Whether to publish credential at the time of creation. By default this is true but settings at dashboard for sandbox_mode take precendence.
                allow_supplemental_evidence:
                  type: boolean
                  description: Whether to allow recipients to add their own supplemental evidence to the Credential, true by default.
                allow_supplemental_references:
                  type: boolean
                  description: Whether to allow recipients to add their own supplemental references to the credential, true by default.
                evidence_items:
                  description: Evidence to add to this credential, that provide more information about how the recipient met the achievement. See Evidence Items for fields. Typically this would include work samples for a course.
                references:
                  description: References to add to this Credential, that provide more information about how the recipient met the achievement. See References for fields. Typically this would be a peer, teacher or manager giving their feedback.
                meta_data:
                  type: object
                  properties: {}
                  description: You can use this parameter to attach key-value strings to the object. Meta data is useful for storing additional, structured information on an object.
              required:
              - recipient.name
              - recipient.email
              - group_id
      security:
      - ApiKeyAuth: []
      x-code-samples:
      - lang: cURL
        label: cURL
        source: "curl -X POST \\\n  \"https://api.accredible.com/v1/credentials\" \\\n  -H \"Authorization: Token token=YOUR_API_KEY\" \\\n  -H \"Content-Type: application/json\" \\\n  -d '{\n  \"credential\": {\n    \"recipient\": {\n      \"name\": \"John Doe\",\n      \"email\": \"person@example.com\",\n      \"phone_number\": \"+14155552671\",\n      \"id\": \"PK-17993\",\n      \"meta_data\": {\n        \"credential_batch\": \"772\"\n      }\n    },\n    \"name\": \"Credential Name\",\n    \"group_name\": \"course1234\",\n    \"group_id\": 23,\n    \"description\": null,\n    \"issued_on\": \"2014-06-14\",\n    \"evidence_items\": [\n      {\n        \"description\": \"Report card including all grades\",\n        \"url\": \"http://www.awesomelearningexample.com/johndoe/reportcard\",\n        \"category\": \"url\"\n      },\n      {\n        \"description\": \"Final essay\",\n        \"file\": \"https://s3.amazonaws.com/accredible_api_evidence_items/files/12/original/open-uri20140316-15266-1m3by6h.jpeg\",\n        \"category\": \"file\"\n      }\n    ],\n    \"references\": [\n      {\n        \"description\": \"John worked hard on this course and provided exemplary understanding of the core concepts\",\n        \"referee\": {\n          \"name\": \"Jane Doe\",\n          \"email\": \"person2@example.com\",\n          \"avatar\": \"https://placehold.it/100x100\",\n          \"url\": \"https://any-url.com\"\n        },\n        \"relationship\": \"managed\"\n      }\n    ],\n    \"custom_attributes\": {\n      \"custom_variables\": \"some value\",\n      \"dob\": \"29 jan 1970\"\n    },\n    \"meta_data\": {\n      \"batch_id\": \"TK210\"\n    }\n  }\n}'"
      x-operation-id-source: normalized
      x-operation-id-original: Create a New Credential
  /v1/credentials/bulk_create:
    post:
      responses:
        '200':
          description: OK
          headers: {}
          content: {}
        '422':
          description: Unprocessable Entity - at least one Credential in the batch failed validation.
          headers: {}
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    oneOf:
                    - type: array
                      description: One entry per Credential that failed, each keyed by the attribute that failed.
                      items:
                        type: object
                        additionalProperties:
                          type: array
                          items:
                            type: string
                    - type: string
                      description: A single message describing why the request could not be processed.
              example:
                errors:
                - user:
                  - Could not assign user to the credential
                  - must exist
      summary: Bulk Create credentials (v1)
      operationId: BulkCreateCredentials(v1)
      description: 'Create multiple Credentials using this action. It requires a JSON object containing credentials in an array.


        **Important:** If you don''t have enough credits when attempting to create Credentials with this endpoint, your credentials will still be created in your account, but will not be published. This will save your data and prevent you from having to re-attempt your request later. You will be able to publish the created credentials in your account when you have the required credits.


        **Note:** When department credits are enabled, requests made with the account-wide API key always deduct from the default department irrespective of which department the credential is being issued into. To deduct from a department, use a department-specific API key instead.


        **API Limits:** Each request can accommodate up to 100 credentials. Should you have a larger set of credentials to process, it''s recommended to split them into batches of 100 and make successive calls to this API.


        Bulk Creating Credentials - Video Walkthrough'
      tags:
      - Credentials
      requestBody:
        content:
          application/json:
            example:
              credentials:
              - recipient:
                  name: John Doe
                  email: student@example.com
                  phone_number: '+14155552671'
                group_id: 22625
              - recipient:
                  name: Jane Smith
                  email: jane@example.com
                  phone_number: '+14155552672'
                group_id: 62430
            schema:
              type: object
              properties:
                credentials:
                  description: Array of the credentials payload all field applicable which is in create credential endpoint.
              required:
              - credentials
      security:
      - ApiKeyAuth: []
      x-code-samples:
      - lang: cURL
        label: cURL
        source: "curl -X POST \\\n  \"https://api.accredible.com/v1/credentials/bulk_create\" \\\n  -H \"Authorization: Token token=YOUR_API_KEY\" \\\n  -H \"Content-Type: application/json\" \\\n  -d '{\n  \"credentials\": [\n    {\n      \"recipient\": {\n        \"name\": \"John Doe\",\n        \"email\": \"student@example.com\",\n        \"phone_number\": \"+14155552671\"\n      },\n      \"group_id\": 22625\n    },\n    {\n      \"recipient\": {\n        \"name\": \"Jane Smith\",\n        \"email\": \"jane@example.com\",\n        \"phone_number\": \"+14155552672\"\n      },\n      \"group_id\": 62430\n    }\n  ]\n}'"
      x-operation-id-source: normalized
      x-operation-id-original: Bulk Create credentials (v1)
