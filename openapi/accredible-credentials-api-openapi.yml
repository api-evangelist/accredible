      summary: Search for Credentials (v2)
      operationId: SearchForCredentials(v2)
      description: 'This is a faster alternative to the v1 Search API. It also supports operations on the query fields which can allow you to form more complex queries.


        Following operations are **supported based on the field**. You can also combine operations on multiple fields:


        | Operation | Description | Example |

        |-----------|-------------|----------|

        | `eq` | Exact match (default, if nothing specified). | `{"group.id[eq]": 1}` or `{"group.id": 1}` - Both yield the same result. |

        | `in` | Allows an array of values. | `{"group.id[in]": [1, 2]}` |

        | `lt` | Less than. | `{"issued_on[lt]": "2023-12-31"}` |

        | `gt` | Greater than. | `{"issued_on[gt]": "2023-01-01"}` |

        | `lte` | Less than equal to. | `{"expired_on[lte]": "2023-12-31"}` |

        | `gte` | Greater than equal to. | `{"expired_on[gte]": "2023-01-01"}` |


        **Note:** Offset-based pagination using `page.from` + `page.size` supports a maximum of 10,000 results. To retrieve results beyond this limit, use cursor-based pagination with `page.cursor` and `page.size`.


        **Note:** Results from this endpoint do **not** carry the `skills` field that the other credential endpoints return. To read a credential''s framework skills, fetch it with View a Credential.'
      tags:
      - Credentials
      requestBody:
        content:
          application/json:
            examples:
              Offset-based pagination:
                value:
                  query:
                    group.id[in]:
                    - 1
                    - 2
                    recipient_name: John Doe
                    approve: true
                    recipient_email: person@example.com
                    recipient_id: example
                    recipient_meta_data:
                      example: value
                    license_id: example
                    meta_data:
                      example: value
                    custom_attributes:
                      example: value
                    issued_on[gte]: '2023-01-01'
                    issued_on[lt]: '2024-01-01'
                    updated_at[gte]: '2023-01-01'
                    created_at[gte]: '2023-01-01'
                  sort:
                    issued_on: desc
                  page:
                    from: 0
                    size: 50
              Cursor-based pagination:
                value:
                  query:
                    group.id[in]:
                    - 1
                    - 2
                    recipient_name: John Doe
                    approve: true
                    recipient_email: person@example.com
                    recipient_id: example
                    recipient_meta_data:
                      example: value
                    license_id: example
                    meta_data:
                      example: value
                    custom_attributes:
                      example: value
                    issued_on[gte]: '2023-01-01'
                    issued_on[lt]: '2024-01-01'
                    updated_at[gte]: '2023-01-01'
                    created_at[gte]: '2023-01-01'
                  sort:
                    issued_on: desc
                  page:
                    cursor: WzEsMC4wXQ==
                    size: 50
            schema:
              type: object
              required:
              - query
              properties:
                query:
                  type: object
                  properties:
                    uuid:
                      type: string
                      description: 'Limit the returned credentials to a specific UUID.


                        Supported operations - `eq`, `in`'
                    group.id:
                      type: string
                      description: 'Limit the returned credentials to a specific group ID.


                        Supported operations - `eq`, `in`'
                    recipient_name:
                      type: string
                      description: 'Limit the returned credentials to a recipient''s name.


                        Supported operations - `eq`, `in`'
                    approve:
                      type: boolean
                      description: 'Return only published or unpublished credentials by specifying the desired value (true/false). If not specified, all credentials will be returned.


                        Supported operations - `eq`'
                    recipient_email:
                      type: string
                      description: 'Limit the returned credentials to a specific recipient''s email address.


                        Supported operations - `eq`, `in`'
                    recipient_id:
                      type: string
                      description: 'Limit the returned credentials to a specific recipient user identifier (ID) you set whilst creating credentials.


                        Supported operations - `eq`, `in`'
                    recipient_meta_data:
                      type: object
                      properties: {}
                      description: 'String key/values for client''s own data on the recipient.


                        Supported operations - none'
                    license_id:
                      type: string
                      description: 'Limit the returned credentials to a specific credential id you set whilst creating the credential.


                        Supported operations - `eq`, `in`'
                    meta_data:
                      type: object
                      properties: {}
                      description: 'String key/values for client''s own data on the credential.


                        Supported operations - none'
                    custom_attributes:
                      type: object
                      properties: {}
                      description: 'String key/values for client''s own data on the credential.


                        Supported operations - none'
                    issued_on:
                      type: string
                      description: 'Date on which the credentials have been issued. Format: YYYY-MM-DD


                        Supported operations - `eq`, `in`, `lt`, `lte`, `gt`, `gte`'
                    expired_on:
                      type: string
                      description: 'Date on which the credentials will expire. Format: YYYY-MM-DD


                        Supported operations - `eq`, `in`, `lt`, `lte`, `gt`, `gte`'
                    updated_at:
                      type: string
                      description: 'Date on which the credentials have been updated. Format: YYYY-MM-DD


                        Supported operations - `eq`, `in`, `lt`, `lte`, `gt`, `gte`'
                    created_at:
                      type: string
                      description: 'Date on which the credentials have been created. Format: YYYY-MM-DD


                        Supported operations - `eq`, `in`, `lt`, `lte`, `gt`, `gte`'
                sort:
                  type: object
                  properties:
                    String key/value pair for sorting based on a field and order.:
                      type: string
