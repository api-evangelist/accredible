      summary: Bulk Create Credentials (v2)
      operationId: BulkCreateCredentials(v2)
      description: '**Important:** If you don''t have enough credits when attempting to create Credentials with this endpoint, your credentials will still be created in your account, but will not be published.

        It supports multi-status responses, where partial successes and errors are consolidated into a single structure with `status: 207 Multi-Status`.

        You will be able to publish the created credentials in your account when you have the required credits.


        **Note:** When department credits are enabled, requests made with the account-wide API key always deduct from the default department irrespective of which department the credential is being issued into. To deduct from a department, use a department-specific API key instead.


        **API Limits:** Each request can accommodate up to 30 credentials. Should you have a larger set of credentials to process, it''s recommended to split them into batches of 30 and make successive calls to this API.'
      tags:
      - Credentials
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                credentials:
                  description: Array of the credentials payload all field applicable which is in create credential endpoint.
              required:
              - credentials
            example:
              credentials:
              - recipient:
                  name: John Doe
                  email: student@example.com
                  phone_number: '+14155552671'
                group_id: 22625
              - recipient:
                  name: Jane Smith
                  email: jane@example.com
                  phone_number: '+14155552672'
                group_id: 62430
      security:
      - ApiKeyAuth: []
      x-code-samples:
