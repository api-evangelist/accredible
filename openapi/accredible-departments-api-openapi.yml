    get:
      responses:
        '200':
          description: OK
          headers: {}
          content:
            application/json:
              schema:
                type: object
                properties:
                  department:
                    type: object
                    properties:
                      id:
                        type: number
                      name:
                        type: string
                      description:
                        type: string
                      url:
                        type: string
                      logo:
                        type: string
                      page_banner:
                        type: string
                      whitelabel_logo:
                        type: string
                      linkedin_company_id:
                        type: string
                      meta_data:
                        type: object
                        properties:
                          internal_id:
                            type: string
                          faculty:
                            type: string
                      generate_private_credential:
                        type: boolean
              example:
                department:
                  id: 1234
                  name: New Department
                  description: Example description text.
                  url: https://www.example.com
                  logo: https://images.credential.net/example/department_logo.png
                  page_banner: https://images.credential.net/example/banner_image.png
                  whitelabel_logo: https://images.credential.net/example/whitelabel_logo.png
                  linkedin_company_id: '5098253'
                  meta_data:
                    internal_id: R12
                    faculty: physics
                  generate_private_credential: false
      summary: View a Department
      operationId: ViewADepartment
      description: 'View a single Department.


        Authorization depends on the type of API key you use:


        | Account-wide key | Department-specific key |

        | --- | --- |

        | Any Department in the account | Its own Department only |'
      tags:
      - Departments
      security:
      - ApiKeyAuth: []
      x-code-samples:
      - lang: cURL
        label: cURL
        source: "curl -X GET \\\n  \"https://api.accredible.com/v1/departments/12345\" \\\n  -H \"Authorization: Token token=YOUR_API_KEY\""
      x-operation-id-source: normalized
      x-operation-id-original: View a Department
    put:
      responses:
        '200':
          description: OK
          headers: {}
          content:
            application/json:
              schema:
                type: object
                properties:
                  department:
                    type: object
                    properties:
                      id:
                        type: number
                      name:
                        type: string
                      description:
                        type: string
                      url:
                        type: string
                      logo:
                        type: string
                      page_banner:
                        type: string
                      whitelabel_logo:
                        type: string
                      linkedin_company_id:
                        type: string
                      meta_data:
                        type: object
                        properties:
                          internal_id:
                            type: string
                          faculty:
                            type: string
                      generate_private_credential:
                        type: boolean
              example:
                department:
                  id: 1234
                  name: New Department Name
                  description: Example description text.
                  url: https://www.example.com
                  logo: https://images.credential.net/example/department_logo.png
                  page_banner: https://images.credential.net/example/banner_image.png
                  whitelabel_logo: https://images.credential.net/example/whitelabel_logo.png
                  linkedin_company_id: '5098253'
                  meta_data:
                    internal_id: R12
                    faculty: physics
                  generate_private_credential: false
      summary: Update a Department
      operationId: UpdateADepartment
      description: 'Update a Department using this action. It takes a JSON object containing a Department.


        Authorization depends on the type of API key you use:


        | Account-wide key | Department-specific key |

        | --- | --- |

        | Any Department in the account | Its own Department only |'
      tags:
      - Departments
      parameters:
      - name: department_id
        in: path
        description: ID of the Department in the form of an integer for the particular Department requested.
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            example:
              department:
                name: New Department Name
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: A name for the Department. This may be displayed publicly on Credentials.
                description:
                  type: string
                  description: A description for the Department. This may be displayed publicly.
                url:
                  type: string
                  description: URL for directing users to the website for the given Department. This may be used publicly.
                logo:
                  type: string
                  description: URL of an image representing the Department logo. Accredible will copy the given image and store the logo within it's own platform. Images should be square, at least 120px wide by 120px tall. PNG format preferred.
                page_banner:
                  type: string
                  description: URL of an image to display as the Department Banner. Accredible will copy the given image and store the logo within it's own platform. The image should be at least 1920px wide by 300px tall. PNG format preferred.
                whitelabel_logo:
                  type: string
                  description: URL of an image to display in the header and footer of the white-labeled recipient website. The image should be at least 208px wide by 32px tall. PNG format preferred.
                linkedin_company_id:
                  type: string
                  description: The LinkedIn company ID for the given Department.
                meta_data:
                  type: object
                  properties: {}
                  description: You can use this parameter to attach key-value strings to the object. Meta data is useful for storing additional, structured information on an object.
                generate_private_credential:
                  type: boolean
                  description: This boolean value will be used as the default of `Credential.private` when creating a new Credential unless it's overridden by `Group.generate_private_credential` that is set to `true` or `false`.
      security:
      - ApiKeyAuth: []
      x-code-samples:
      - lang: cURL
        label: cURL
        source: "curl -X PUT \\\n  \"https://api.accredible.com/v1/departments/12345\" \\\n  -H \"Authorization: Token token=YOUR_API_KEY\" \\\n  -H \"Content-Type: application/json\" \\\n  -d '{\n  \"department\": {\n    \"name\": \"New Department Name\"\n  }\n}'"
      x-operation-id-source: normalized
      x-operation-id-original: Update a Department
    delete:
      responses:
        '200':
          description: OK
          headers: {}
          content:
            application/json:
              schema:
                type: object
                properties:
                  department:
                    type: object
                    properties:
                      id:
                        type: number
                      name:
                        type: string
                      description:
                        type: string
                      url:
                        type: string
                      logo:
                        type: string
                      page_banner:
                        type: string
                      whitelabel_logo:
                        type: string
                      linkedin_company_id:
                        type: string
                      meta_data:
                        type: object
                        properties:
                          internal_id:
                            type: string
                          faculty:
                            type: string
                      generate_private_credential:
                        type: boolean
              example:
                department:
                  id: 1234
                  name: New Department Name
                  description: Example description text.
                  url: https://www.example.com
                  logo: https://images.credential.net/example/department_logo.png
                  page_banner: https://images.credential.net/example/banner_image.png
                  whitelabel_logo: https://images.credential.net/example/whitelabel_logo.png
                  linkedin_company_id: '5098253'
                  meta_data:
                    internal_id: R12
                    faculty: physics
                  generate_private_credential: false
      summary: Delete a Department
      operationId: DeleteADepartment
      description: 'Delete a Department using this action.


        Authorization depends on the type of API key you use:


        | Account-wide key | Department-specific key |

        | --- | --- |

        | Allowed | Not permitted |'
      tags:
      - Departments
      parameters:
      - name: department_id
        in: path
        description: ID of the Department in the form of an integer for the particular Department requested.
        required: true
        schema:
          type: string
      security:
      - ApiKeyAuth: []
      x-code-samples:
      - lang: cURL
        label: cURL
        source: "curl -X DELETE \\\n  \"https://api.accredible.com/v1/departments/12345\" \\\n  -H \"Authorization: Token token=YOUR_API_KEY\""
      x-operation-id-source: normalized
      x-operation-id-original: Delete a Department
  /v1/departments/search:
    post:
      responses:
        '200':
          description: OK
          headers: {}
          content:
            application/json:
              schema:
                type: object
                properties:
                  departments:
                    type: object
                    properties:
                      id:
                        type: number
                      name:
                        type: string
                      description:
                        type: string
                      url:
                        type: string
                      logo:
                        type: string
                      page_banner:
                        type: string
                      whitelabel_logo:
                        type: string
                      linkedin_company_id:
                        type: string
                      meta_data:
                        type: object
                        properties:
                          internal_id:
                            type: string
                          faculty:
                            type: string
                      generate_private_credential:
                        type: boolean
              example:
                departments:
                  id: 1234
                  name: New Department Name
                  description: Example description text.
                  url: https://www.example.com
                  logo: https://images.credential.net/example/department_logo.png
                  page_banner: https://images.credential.net/example/banner_image.png
                  whitelabel_logo: https://images.credential.net/example/whitelabel_logo.png
                  linkedin_company_id: '5098253'
                  meta_data:
                    internal_id: R12
                    faculty: physics
                  generate_private_credential: false
      summary: Search for Departments
      operationId: SearchForDepartments
      description: 'You can search for departments by various search criteria.


        Authorization depends on the type of API key you use:


        | Account-wide key | Department-specific key |

        | --- | --- |

        | All Departments in the account | Its own Department only |'
      tags:
      - Departments
      requestBody:
        content:
          application/json:
            example:
              meta_data:
                faculty: physics
              page_size: 50
              page: 1
            schema:
              type: object
              properties:
                meta_data:
                  type: object
                page_size:
                  type: number
                  description: The pagination response size, default of 50.
                page:
                  type: number
                  description: The pagination page.
      security:
      - ApiKeyAuth: []
      x-code-samples:
      - lang: cURL
        label: cURL
        source: "curl -X POST \\\n  \"https://api.accredible.com/v1/departments/search\" \\\n  -H \"Authorization: Token token=YOUR_API_KEY\" \\\n  -H \"Content-Type: application/json\" \\\n  -d '{\n  \"meta_data\": {\n    \"faculty\": \"physics\"\n  },\n  \"page_size\": 50,\n  \"page\": 1\n}'"
      x-operation-id-source: normalized
      x-operation-id-original: Search for Departments
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: Authorization
      description: 'Use the format: Token token=YOUR_API_KEY'
