                  message: Skills were not copied — framework version 511 has been retired. The group was cloned without framework skills; re-version the framework to copy them.
      summary: Clone a Group
      operationId: CloneAGroup
      description: 'You can clone a group using this action. Add attributes to override cloned values. Cloning a group only works when certificate or badge designs are within the same department as the original group.


        A clone always mirrors the original Group''s skills framework. Every framework skill on the original is copied to the clone at the same position in the framework, and `skill_framework_version_id` and `framework_skills` sent in the request body are **ignored** — you cannot clone a Group onto a different framework. To change the clone''s skills, clone it first and then update it.


        If the original Group''s framework version has been retired — or its framework is mid-retirement for the original Group''s Department, in which case the version itself still reads as `active` — the clone is created without a framework and a `207` is returned. Re-version the framework first if you need the skills copied.'
      tags:
      - Groups
      requestBody:
        content:
          application/json:
            example:
              group:
                name: new group copy
                course_name: Intro to Prgramming
                course_description: Description of course
                course_link: http://www.example.com
                language: en
                attach_pdf: true
                blockchain: false
                certificate_design_id: null
                badge_design_id: null
                primary_design_id: null
                meta_data:
                  batch_id: '271'
                learning_outcomes:
                - Reading Books
                - Writing Essays
                generate_private_credential: false
                auto_expiry: 1
                auto_expiry_unit: years
                signup_url_show: false
                signup_url: http://www.example.com
                course_link_show: false
                organization_link_show: false
                skill_category_id: 1
                achievement_type: Badge
                earning_criteria:
                - kind: course
                  text: Complete the Intro to Programming course
                  required: true
                  position: 1
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: Name of the group (for your reference and never shown to the recipient). `Copy` will be added to the beginning of name of the new cloned group when a new name is not provided.
                course_name:
                  type: string
                  description: Name of the course or achievement. This is visible to the recipient.
                course_description:
                  type: string
                  description: Description of the course or achievement. This is visible to the recipient.
                course_link:
                  type: string
                  description: Link to the web page with information related to this Credential. Typically this is a course information or event information page.
                language:
                  type: string
                  description: Language for the group. Currently we support "en", "es", "vi", "pt", "ja", "fr", "da", "nl", "fi", "no", "nb", "ro", "sv", "th", "tw", "zh", "tr", "ar", "he", "ms" and "de". Default language is en.
                attach_pdf:
                  type: boolean
                  description: PDF of the Credential should be attached to email when recipient is informed. Default is false.
                blockchain:
                  type: boolean
                  description: Enable or disable recording of these Credentials on a Blockchain.
                certificate_design_id:
                  type: number
                  description: Certificate Design which the Group will use to display Credentials. Certificate design needs to exist in the newly cloned space.
                badge_design_id:
                  type: number
                  description: Badge Design which the Group will use to display Credentials. Badge design needs to exist in the newly cloned space.
                primary_design_id:
                  type: number
                  description: Primary Design which the Group will use to display Credentials.
                meta_data:
                  type: object
                  properties: {}
                  description: You can use this parameter to attach key-value strings to the object. Meta data is useful for storing additional, structured information on an object.
                learning_outcomes:
                  description: 'Searchable keywords identifying skills credential-holders need to demonstrate (or have learned) in the process of earning this credential.


                    A clone always takes its skills source from the original Group, so framework skills cannot be set here — see the cloning behaviour described above and the [Skills Frameworks](#tag/Skills-Frameworks) endpoints.'
                generate_private_credential:
                  type: boolean
                  description: The default value of `Credential.private` for the Group. The supported values are `true`, `false`, and `null`. When this is set to `true` or `false`, it will override `Department.generate_private_credential` and be used as the default of `Credential.private` when creating a new `Credential`. When this is set to `null`, it won't override `Department.generate_private_credential` which will be used for the default of `Credential.private` instead.
                auto_expiry:
                  type: number
                  description: Specifies the number of years or months (see `auto_expiry_unit`) from the issue date after which the credential will automatically expire. If the specified value is less than or equal to 0, it will be ignored.
                auto_expiry_unit:
                  type: string
                  enum:
                  - years
                  - months
                  description: The unit of time for `auto_expiry`. Defaults to `years` if not supplied and `auto_expiry` exists.
                signup_url:
                  type: string
                  description: This provides a direct path for credential viewers to enroll in your course.
                signup_url_show:
                  type: boolean
                  description: Show or hide the sign up url. The supported values are `true`, `false` and `null`.
                course_link_show:
                  type: boolean
                  description: This links the credential data record to your information about the credential on your website. The supported values are `true`, `false` and `null`.
                organization_link_show:
                  type: boolean
                  description: Show or hide the link to your website homepage. The supported values are `true`, `false` and `null`.
                allow_duplicate_credentials:
                  type: boolean
                  description: An email address can receive more than one credential. The supported values are `true` & `false`. Defaults to `false`.
                skill_category_id:
                  type: number
                  description: ID of the skill category to associate with the cloned group.
                achievement_type:
                  type: string
                  description: The type of achievement, for example 'Award' or 'Certification'. The supported values are listed here https://www.imsglobal.org/spec/ob/v3p0#achievementtype-enumeration
                earning_criteria:
                  type: array
                  description: 'Earning criteria for the cloned group. **Omit the key** to copy the original group''s criteria as-is. **Provide an array** to replace them: each item creates a new criterion on the clone (`id` is ignored, since clone never updates an existing criterion).'
                  items:
                    type: object
                    properties:
                      kind:
                        type: string
                        enum:
                        - achievement
                        - certificate
                        - competency
                        - completion
                        - course
                        - degree
                        - exam
                        - experience
                        - knowledge
                        - license
                        - participation
                        - reading
                        - skill
                        - specialization
                        - other
                      text:
                        type: string
                        description: 'Human-readable description of the criterion. Supports a limited set of HTML tags: `<a>` (with `href`, `title`, `target`, `rel`), `<p>`, `<br>`, `<hr>`, `<ul>`, `<ol>`, `<li>`, `<strong>`/`<b>`, `<em>`/`<i>`, `<u>`, `<sub>`, `<sup>`. Other tags and attributes are stripped on save.'
                      required:
                        type: boolean
                      position:
                        type: number
                    required:
                    - kind
                    - text
      security:
      - ApiKeyAuth: []
      x-code-samples:
      - lang: cURL
        label: cURL
        source: "curl -X POST \\\n  \"https://api.accredible.com/v1/issuer/groups/12345/clone\" \\\n  -H \"Authorization: Token token=YOUR_API_KEY\" \\\n  -H \"Content-Type: application/json\" \\\n  -d '{\n  \"group\": {\n    \"name\": \"new group copy\",\n    \"course_name\": \"Intro to Prgramming\",\n    \"course_description\": \"Description of course\",\n    \"course_link\": \"http://www.example.com\",\n    \"language\": \"en\",\n    \"attach_pdf\": true,\n    \"blockchain\": false,\n    \"certificate_design_id\": null,\n    \"badge_design_id\": null,\n    \"primary_design_id\": null,\n    \"meta_data\": {\n      \"batch_id\": \"271\"\n    },\n    \"learning_outcomes\": [\n      \"Reading Books\",\n      \"Writing Essays\"\n    ],\n    \"generate_private_credential\": false,\n    \"auto_expiry\": 1,\n    \"auto_expiry_unit\": \"years\",\n    \"signup_url_show\": false,\n    \"signup_url\": \"http://www.example.com\",\n    \"course_link_show\": false,\n    \"organization_link_show\": false,\n    \"skill_category_id\": 1,\n    \"earning_criteria\": [\n      {\n        \"kind\": \"course\",\n        \"text\": \"Complete the Intro to Programming course\",\n        \"required\": true,\n        \"position\": 1\n      }\n    ]\n  }\n}'"
      x-operation-id-source: normalized
      x-operation-id-original: Clone a Group
