openapi: 3.2.0
info:
  title: Accredible Credential Collections API
  version: 25.08.0
  description: 'The Accredible Credential API allows you to create and interact with badges and certificates called Accredible Credentials. There are 3 main objects in Accredible: Credentials, Groups and Designs. ### Getting Started with the API - Video Walkthrough


    ![Getting Started with the API Video Walkthrough](https://us06web.zoom.us/clips/share/_p4jjy0LQ-WOaQPviLor1A)


    # Objects Overview

    ## Credentials

    Credentials are the core object in the API. They collect all of the data related to a course, training activity or achievement and the recipient/participant information. You should create a credential for each achievement completion that a recipient has. For example if John Doe finishes the Programming 101 course we should create one credential to represent that. If John Doe achieves something else then he would need a new credential. ## Groups


    Groups represent an achievement such as a course or qualification. They contain information about the achievement and have multiple Credentials attached to them. For example you should create a group for the Introduction to Programming course. You''d provide the Course Name, Course Description and Course URL. In the future you can pass the name or ID of this group when creating a credential so that the credential is passed all the information relating to the achievement. ## Designs


    Designs provide a visual specification for how a Credential should be rendered. Designs can be used across multiple Groups. For example if we have three courses: Intro to Basic Programming, Intro to Advanced Programming and Intro to DevOps each of these may have the same design for their Credentials. When creating or updating their corresponding Groups you would attach the desired design accordingly. ## Departments


    Departments, if enabled for your account allow you to manage multiple, independent organization groups. Each Department is entirely separate with its own Designs, Groups, Branding, etc. You cannot share data between Departments except Billing and Administrators. ## Attributes


    Attributes, are used to merge information with your badge or certificate designs and email templates. Attributes act as placeholders for information and can be added to certificate designs and email templates. ## Skills Frameworks


    Skills Frameworks are structured taxonomies of skills — Accredible-maintained ones such as O*NET, ESCO and NACE, plus any your organization uploads itself. Tagging a Group against a framework version replaces the Group''s free-text `learning_outcomes` with skills that carry a stable identifier and a known position in a recognized taxonomy. For example, instead of listing `"Reading Books"` on your Introduction to Programming group, you can attach the O*NET skill `Reading Comprehension` together with the trail it sits on — Worker Requirements → Basic Skills → Content. Frameworks are read-only over the API: you discover the frameworks enabled for a department, search their skills, then select those skills when creating or updating a Group. Uploading and managing frameworks is done in the Accredible Dashboard. # API Keys


    API keys are used as Authorization tokens in the header in all authenticated API endpoints. These Keys are managed in the Accredible Dashboard. There are two types of API Keys, those that are account wide and work on all assets and those that are related to a specific department. API keys scoped to a specific department can only access the resources (Credentials, Groups, Designs etc.) belonging to that department. # Single sign-on options


    Single sign-on in addition to the student authentication provided by Accredible, you can also use single sign-on to authenticate your student into Accredible and they can directly sign-in. SSO is also available via our Integrations and via SAML 2.0. # Rate Limiting


    We allow up to 2000 requests every 5 minutes from a single IP address, but some higher security endpoints have stricter rate limiting. Requests are counted in 30 second periods.'
servers:
- url: https://api.accredible.com/
  description: Production environment - US
- url: https://eu.api.accredible.com/
  description: Production environment - EU
- url: https://sandbox.api.accredible.com/
  description: Sandbox environment - Testing environment
tags:
- name: Collections
  description: 'A Collection is a curated set of groups.


    To create one, you''ll need to provide a collection name, a description, and indicate whether it should be public or private. Once created, you can assign groups to the collection using the Groups APIs.'
paths:
  /v1/collections:
    post:
      responses:
        '200':
          description: OK
          headers: {}
          content: {}
      summary: Create a Collection
      operationId: CreateACollection
      description: ''
      tags:
      - Collections
      requestBody:
        content:
          application/json:
            example:
              collection:
                name: Collection name
                description: DESCRIPTION
                public: true
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: Name of the Collection.
                description:
                  type: string
                  description: Description of the collection.
                public:
                  type: boolean
                  description: A boolean to indicate if a collection will be public or not.
              required:
              - name
      security:
      - ApiKeyAuth: []
      x-code-samples:
      - lang: cURL
        label: cURL
        source: "curl -X POST \\\n  \"https://api.accredible.com/v1/collections\" \\\n  -H \"Authorization: Token token=YOUR_API_KEY\" \\\n  -H \"Content-Type: application/json\" \\\n  -d '{\n  \"collection\": {\n    \"name\": \"Collection name\",\n    \"description\": \"DESCRIPTION\",\n    \"public\": true\n  },\n'"
      x-operation-id-source: normalized
      x-operation-id-original: Create a Collection
  /v1/collections/{collection_id}:
    put:
      responses:
        '200':
          description: OK
          headers: {}
          content: {}
      summary: Update a Collection
      operationId: UpdateACollection
      description: ''
      tags:
      - Collections
      parameters:
      - name: collection_id
        in: path
        description: ID of the collection in the form of an integer for the particular collection requested.
        required: true
        schema:
          type: number
      requestBody:
        content:
          application/json:
            example:
              collection:
                name: Collection name
                description: DESCRIPTION
                public: true
                groups:
                - id: 1
                - id: 2
                - id: 3
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: Name of the Collection.
                description:
                  type: string
                  description: Description of the collection.
                public:
                  type: boolean
                  description: A boolean to indicate if a collection will be public or not.
                groups:
                  description: Full List of groups to associate with the collection
              required:
              - name
      security:
      - ApiKeyAuth: []
      x-code-samples:
      - lang: cURL
        label: cURL
        source: "curl -X PUT \\\n  \"https://api.accredible.com/v1/collections/12345\" \\\n  -H \"Authorization: Token token=YOUR_API_KEY\" \\\n  -H \"Content-Type: application/json\" \\\n  -d '{\n  \"collection\": {\n    \"name\": \"Collection name\",\n    \"description\": \"DESCRIPTION\",\n    \"public\": true,\n    \"groups\": [\n      {\n        \"id\": 1\n      },\n      {\n        \"id\": 2\n      },\n      {\n        \"id\": 3\n      }\n    ]\n  }\n}'"
      x-operation-id-source: normalized
      x-operation-id-original: Update a Collection
    delete:
      responses:
        '200':
          description: OK
          headers: {}
          content: {}
      summary: Delete a Collection
      operationId: DeleteACollection
      description: ''
      tags:
      - Collections
      parameters:
      - name: collection_id
        in: path
        description: ID of the Collection in the form of an integer for the particular Collection requested.
        required: true
        schema:
          type: number
      security:
      - ApiKeyAuth: []
      x-code-samples:
      - lang: cURL
        label: cURL
        source: "curl -X DELETE \\\n  \"https://api.accredible.com/v1/collections/12345\" \\\n  -H \"Authorization: Token token=YOUR_API_KEY\""
      x-operation-id-source: normalized
      x-operation-id-original: Delete a Collection
  /v1/collections/search:
    post:
      responses:
        '200':
          description: OK
          headers: {}
          content:
            application/json:
              schema:
                type: object
                properties:
                  collections:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        name:
                          type: string
                        description: {}
                        organization_id:
                          type: number
                        public:
                          type: boolean
                        groups_count:
                          type: number
                        groups:
                          type: array
                          items:
                            type: object
                            properties:
                              id:
                                type: number
                            required:
                            - id
                      required:
                      - id
                      - name
                      - description
                      - organization_id
                      - public
                      - groups_count
                      - groups
                  meta:
                    type: object
                    properties:
                      current_page:
                        type: number
                      next_page:
                        type: number
                      prev_page:
                        type: number
                      total_pages:
                        type: number
                      total_count:
                        type: number
                      page_size:
                        type: number
              example:
                collections:
                - id: 809fxsq0-fx89-11ef-8c4a-b7d12b7poib3
                  name: abc
                  description: null
                  organization_id: 231
                  public: true
                  groups_count: 1
                  groups:
                  - id: 1
                - id: 666fxsq2-fx00-11cf-8c4a-11112b7poib3
                  name: abc
                  description: null
                  organization_id: 231
                  public: true
                  groups_count: 1
                  groups:
                  - id: 12
                meta:
                  current_page: 10
                  next_page: 11
                  prev_page: 9
                  total_pages: 119
                  total_count: 238
                  page_size: 99
      summary: Search for Collections
      operationId: SearchForCollections
      description: ''
      tags:
      - Collections
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - query
              properties:
                query:
                  type: object
                  properties:
                    ids:
                      type: array
                      items: {}
                      description: Limit the returned collections to specific collections IDs.
                    name:
                      type: string
                      description: Search collections by name (substring search)
                    public:
                      type: boolean
                      description: Limit the returned collections to public or not public collections.
                    exclusion_list:
                      type: array
                      items: {}
                      description: Exclude specific collections IDs from the search results.
                sort:
                  type: object
                  properties:
                    String key/value pair for sorting based on a field and order.:
                      type: string
                      description: 'Supported keys - `name`, `groups_count` and `public`

                        Supported values - `asc`, `desc`'
                meta:
                  type: object
                  properties:
                    page_number:
                      type: string
                      description: Defines the number of page wanted
                    per_page:
                      type: string
                      description: The number of records to be returned
      security:
      - ApiKeyAuth: []
      x-code-samples:
      - lang: cURL
        label: cURL
        source: "curl -X POST \\\n  \"https://api.accredible.com/v1/collections/search\" \\\n  -H \"Authorization: Token token=YOUR_API_KEY\" \\\n  -H \"Content-Type: application/json\" \\\n  -d '{\n  \"query\": {\n    \"ids\": [\n      1,\n      2,\n      3\n    ],\n    \"name\": \"John Doe\",\n    \"public\": true,\n    \"exclusion_list\": [\n      1,\n      2,\n      3\n    ]\n  },\n  \"sort\": {\n    \"groups_count\": \"desc\"\n  },\n  \"meta\": {\n    \"page_number\": 1,\n    \"per_page\": 20\n  }\n}'"
      x-operation-id-source: normalized
      x-operation-id-original: Search for Collections
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: Authorization
      description: 'Use the format: Token token=YOUR_API_KEY'
